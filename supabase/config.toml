# Configuração das Edge Functions pra CLI do Supabase.
# Troque SEU_PROJETO pelo id do seu projeto (ou rode "supabase link").
project_id = "lllcdkwkvqbszdawzhua"

# O Meta chama o webhook sem login do Supabase: precisa ser público.
[functions.instagram-webhook]
verify_jwt = false

# Os robôs são chamados pelo pg_cron (sem login). Eles se protegem
# sozinhos com o header x-sched-key = SCHED_SECRET.
[functions.ig-scheduler]
verify_jwt = false

[functions.ig-token-refresh]
verify_jwt = false

# Estas duas são chamadas pelo painel (pessoa logada): JWT ligado.
[functions.ig-insights]
verify_jwt = true

[functions.ig-media]
verify_jwt = true
